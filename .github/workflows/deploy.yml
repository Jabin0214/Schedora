name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: schedora-app
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 前端 build → 输出到 Backend/wwwroot ──
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install & build frontend
        working-directory: Frontend
        run: |
          npm ci
          npm run build

      # ── 后端 publish ──
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish backend
        working-directory: Backend
        run: dotnet publish InspectionApi.csproj -c Release -o ${{ github.workspace }}/publish

      # ── 打 zip 包 ──
      - name: Zip artifact
        working-directory: ${{ github.workspace }}/publish
        run: zip -r ${{ github.workspace }}/app.zip .

      # ── Azure 登录 ──
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ── 部署 zip 到 App Service ──
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/app.zip

      - name: Logout
        if: always()
        run: az logout
